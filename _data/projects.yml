- id: pharmacyshifts
  name: PharmacyShifts
  status_label: Live in production
  period: Feb 2026 – present
  page: /projects/pharmacyshifts/
  summary: >-
    A shift discovery platform for UK locum pharmacists. It ingests about 3,900 new or
    updated listings a day from 3 agencies and resolves them into 30,000+
    deduplicated live shifts, with radius search and alerts.
  stack: [Python, FastAPI, PostgreSQL/PostGIS, Redis, Next.js, TypeScript, Docker, Prometheus, GitHub Actions]
  links:
    - label: pharmacyshifts.app
      url: https://pharmacyshifts.app/
  repo_note: Private repository

