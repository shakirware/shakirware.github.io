- id: pharmacyshifts
  group: featured
  name: PharmacyShifts
  status_label: Live in production
  period: Feb 2026 – present
  page: /projects/pharmacyshifts/
  summary: >-
    Helps UK locum pharmacists find and compare shifts from three agencies. It collects listings on a schedule, matches the same shift across agencies, and adds radius search and alerts.
  links:
    - label: pharmacyshifts.app
      url: https://pharmacyshifts.app/

- id: homelab
  group: featured
  name: Homelab
  status_label: Live, in daily use
  period: Jan 2026 – present
  page: /projects/homelab/
  summary: >-
    My self-hosted infrastructure on a single Proxmox server. OpenTofu provisions the NixOS VMs and Colmena deploys their configuration, so the whole setup is defined in code.
  links:
    - label: GitHub
      url: https://github.com/shakirware/homelab-nix

