- id: autotrader-analyser
  group: older
  name: Car listing analyser
  status_label: Experiment
  period: Jun 2024
  summary: >-
    Helps compare used cars for sale. It reads listings, finds the number plate in the photos, looks up MOT history and ranks the cars with a weighted score.
  links:
    - label: GitHub
      url: https://github.com/shakirware/autotrader-uk-scraper-analyzer

- id: secure-chat
  group: older
  name: Secure Chat
  status_label: MSc dissertation
  period: May – Sep 2023
  summary: >-
    An end-to-end encrypted chat prototype inspired by Telegram. It uses TLS, X25519/HKDF key agreement and per-message key ratcheting for direct, group and offline messages.
  links:
    - label: GitHub
      url: https://github.com/shakirware/secure-chat-app

- id: chess-engine
  group: older
  name: Chess Engine
  status_label: BSc dissertation
  period: Jan – May 2022
  summary: >-
    A Java chess engine with a JavaFX board. It uses 0x88 move generation, a 4-ply alpha-beta search and a Polyglot opening-book reader.
  links:
    - label: GitHub
      url: https://github.com/shakirware/chess-engine

