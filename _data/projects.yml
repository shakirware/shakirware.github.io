- id: c-memory-dumper
  group: older
  name: C memory dumper
  status_label: Early experiment
  period: Aug 2018
  summary: >-
    An early look at how Linux exposes process memory. It reads a process's <code>/proc/&lt;pid&gt;/maps</code> and dumps each mapped region from <code>/proc/&lt;pid&gt;/mem</code>.
  links:
    - label: GitHub
      url: https://github.com/shakirware/C-memory-dumper
