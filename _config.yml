title: shakr.dev
description: "Software engineer interested in backend systems, infrastructure and building useful things."
author:
  name: Shakir
  email: shakir-redhead@outlook.com
lang: en-GB
url: https://shakr.dev

social:
  links:
    - https://github.com/shakirware

favicon: assets/favicon.svg
remote_theme: riggraz/no-style-please

theme_config:
  appearance: dark
  date_format: "%Y-%m-%d"
  lowercase_titles: true
  show_description: true

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

permalink: /writing/:title/

# Every article is marked as in progress until its post sets in_progress: false.
defaults:
  - scope:
      type: posts
    values:
      in_progress: true

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - vendor/
  - node_modules/
