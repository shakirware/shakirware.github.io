title: shakr.dev
author:
  name: Shakir
  email: shakir-redhead@outlook.com
lang: en-GB
url: https://shakr.dev

social:
  links:
    - https://github.com/shakirware

favicon: assets/favicon.svg
remote_theme: riggraz/no-style-please

theme_config:
  appearance: dark
  date_format: "%Y-%m-%d"
  lowercase_titles: true

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

permalink: /writing/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - vendor/
  - node_modules/
